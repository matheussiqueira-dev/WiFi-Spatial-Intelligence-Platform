# Atualizações de versão mensais (auditoria FinOps de 06/11/2026): menos PRs automáticos e
# menos builds de prévia. As atualizações de segurança do Dependabot seguem imediatas.
# Update proposals only: every dependency change is still an explicit, reviewed PR,
# and Python locks must be revalidated on Windows and Docker (see CLAUDE.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      web-tooling:
        dependency-type: development
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
