# Free-tier CI: Linux runners only (private repositories have a monthly minute quota).
# Mirrors scripts/verify/check.ps1 without Windows-only launchers; no secrets are used.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r apps/api/requirements.lock.txt
      - name: Exported contracts are in sync
        run: python scripts/verify/export_contract.py --check
      # Ruff, format, backend and launcher tests, pip-audit of both locks.
      - name: Linux checks
        run: python scripts/verify/linux_checks.py

  web:
    name: Web (lint, types, unit, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build

  e2e:
    name: E2E (Chromium + WebKit, lab and commercial-br, real API + temporary SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # playwright.config.ts starts the API from apps/api/.venv, as on developer machines.
      - name: API virtual environment
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -r apps/api/requirements.lock.txt
      - run: npm ci
      - run: npx --workspace apps/web playwright install --with-deps chromium webkit
      - run: npm run build:e2e
      - name: End-to-end tests (Chromium + WebKit, lab profile)
        run: npm run test:e2e
        env:
          E2E_RUVIEW: "0"
          E2E_BROWSERS: chromium,webkit
          E2E_PROFILE: lab
      - name: End-to-end tests (commercial-br profile)
        run: npm run test:e2e
        env:
          E2E_RUVIEW: "0"
          E2E_BROWSERS: chromium
          E2E_PROFILE: commercial-br
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  security:
    name: Security (secrets, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Gitleaks CLI (MIT) pinned by version and checksum; the hosted action is not used.
      - name: Secret scan (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: npm audit (lockfile)
        run: npm audit --audit-level=moderate
